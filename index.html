<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Caderno de Receitas</h1>
        <p class="brand-sub">direto do papel pra tela</p>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <line x1="14" y1="14" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="search" type="text" placeholder="Buscar por nome, ingrediente ou tag…" autocomplete="off">
      </div>
    </div>
    <nav class="filters" id="filters" aria-label="Filtrar por categoria">
      <button class="chip is-active" data-cat="todas">Todas</button>
    </nav>
  </header>

  <main id="main">
    <div id="status" class="status">Abrindo o caderno…</div>
    <section id="grid" class="grid" hidden></section>
    <div id="empty" class="empty" hidden>
      <p class="empty-title">Nenhuma receita encontrada</p>
      <p class="empty-sub">Tente buscar por outro termo ou escolha outra categoria.</p>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button class="close" id="closeBtn" aria-label="Fechar receita">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <line x1="4" y1="4" x2="16" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="16" y1="4" x2="4" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <footer class="foot">
    <p>Feito com Google Sheets + Apps Script — atualiza sozinho toda vez que uma receita nova entra na planilha.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
